<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How offices changed after the pandemic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #23606C;
    --coral: #D6683C;
    --ink: #121212;
    --body: #333333;
    --muted: #6B6B6B;
    --rule: #E1E1E1;
    --pen: #4A4036;
    --paper: #FBF6EC;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: var(--body); font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .fof-graphic { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  .kicker { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
  .fof-graphic h3 { margin: 0 0 16px; font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: clamp(24px, 4vw, 32px); line-height: 1.15; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  .paper { padding: 14px 12px 14px; background: var(--paper); border: 1px solid #EADFC9; border-radius: 10px;
           background-image: radial-gradient(rgba(120,100,70,.06) 1px, transparent 1px); background-size: 6px 6px; }
  .chart { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .grid { stroke: #DCCFB6; stroke-width: 1; stroke-dasharray: 3 5; }
  .grid-label { font-size: 11px; fill: #8A7D69; }
  .year { font-family: "Source Serif 4", Georgia, serif; font-size: 13px; font-weight: 600; fill: #6E6252; text-anchor: middle; }
  .tick { stroke: #B9AB92; stroke-width: 1.4; stroke-linecap: round; }
  .area { fill: url(#fof-fill); }
  .road { fill: none; stroke: var(--teal); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .road-dash { fill: none; stroke: #FBF6EC; stroke-width: 1.4; stroke-dasharray: 5 7; stroke-linecap: round; }
  .stop circle { fill: var(--coral); stroke: var(--paper); stroke-width: 3; transition: r .15s; cursor: pointer; }
  .stop text { font-family: "Source Serif 4", Georgia, serif; font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; pointer-events: none; }
  .stop.active circle { fill: var(--teal); }
  .stop:focus { outline: none; }
  .stop:focus circle { stroke: var(--pen); }
  .note { font-family: Caveat, "Comic Sans MS", cursive; font-size: 20px; font-weight: 600; fill: var(--pen); }
  .cursor-dot { fill: var(--ink); stroke: #fff; stroke-width: 2; }
  .cursor-line { stroke: var(--pen); stroke-width: 1; stroke-dasharray: 2 3; }
  .info { margin: 8px 2px 0; min-height: 1.5em; font-size: 14px; line-height: 1.4; color: var(--ink); }
  .info strong { font-weight: 600; }
  /* Chapter cards */
  .chapters { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .chapter { position: relative; padding: 10px 10px 12px; background: #fff; border: 1px solid #EADFC9; border-radius: 10px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .chapter:hover, .chapter:focus-within, .chapter.active { border-color: var(--coral); box-shadow: 0 0 0 2px rgba(214,104,60,.18); }
  .chapter button { all: unset; display: block; width: 100%; cursor: pointer; }
  .txt { display: block; }
  .chapter button:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; border-radius: 4px; }
  .pic { display: block; width: 100%; height: auto; max-width: 150px; margin: 0 auto 6px; }
  .pic * { vector-effect: non-scaling-stroke; }
  .num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin-right: 6px; border-radius: 50%; background: var(--coral); color: #fff; font-family: "Source Serif 4", Georgia, serif; font-size: 12px; font-weight: 700; vertical-align: 1px; }
  .when { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); }
  .chapter h4 { margin: 6px 0 4px; font-family: "Source Serif 4", Georgia, serif; font-size: 16px; line-height: 1.2; color: var(--ink); }
  .chapter p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--body); }
  .price-chip { display: inline-block; line-height: 1.35; margin-top: 8px; padding: 2px 8px; border-radius: 999px; background: #F6E3D8; color: #8A3A1C; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (min-width: 701px) { .price-chip { font-size: 11.5px; padding: 3px 8px; white-space: normal; border-radius: 10px; } }
  .footer { margin-top: 14px; font-size: 12px; line-height: 1.55; color: var(--muted); }
  .footer p { margin: 0 0 6px; }
  .footer strong { color: var(--body); font-weight: 600; }
  .footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .credit { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--teal); }
  .credit a { color: inherit; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .tool-btn { appearance: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--teal); background: #fff; border: 1px solid var(--teal); border-radius: 4px; min-height: 40px; padding: 8px 14px; cursor: pointer; }
  .tool-btn:hover { background: var(--teal); color: #fff; }
  .tool-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .tool-btn[disabled] { opacity: .6; cursor: wait; }
  .embed-box { display: none; margin-top: 10px; }
  .embed-box.open { display: block; }
  .embed-box label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .embed-box textarea { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 10px; resize: vertical; }
  .embed-row { margin-top: 8px; }
  .status { font-size: 12px; color: var(--teal); }
  /* Storybook postcard */
  .paper { position: relative; }
  .note-tl { transition: opacity .2s; }
  .paper.story-on .note-tl { opacity: 0; }
  .link { fill: none; stroke: var(--coral); stroke-width: 1.6; stroke-dasharray: 3 4; stroke-linecap: round; }
  .postcard { position: absolute; z-index: 5; left: 0; top: 0; width: 33%; min-width: 200px; max-width: 250px; padding: 8px 8px 6px; background: #FDF9F1; border: 1px solid #E3D5BC; border-radius: 6px;
              box-shadow: 0 10px 24px rgba(74,64,54,.18), 0 2px 4px rgba(74,64,54,.08); pointer-events: none;
              opacity: 0; visibility: hidden; transform: rotate(-1.5deg) translateY(8px) scale(.94);
              transition: opacity .2s, transform .28s cubic-bezier(.2,.8,.3,1.2), visibility 0s linear .28s; }
  .postcard.show { opacity: 1; visibility: visible; transform: rotate(-1.5deg); transition: opacity .2s, transform .28s cubic-bezier(.2,.8,.3,1.2); }
  .tape { position: absolute; top: -8px; left: 50%; width: 58px; height: 16px; margin-left: -29px; background: rgba(214,104,60,.28); transform: rotate(3deg); }
  .scene { display: none; width: 100%; height: auto; border-radius: 3px; }
  .scene.on { display: block; }
  .pc-cap .num { flex-shrink: 0; }
  .pc-cap { display: flex; align-items: center; gap: 2px; margin: 5px 2px 0; font-family: Caveat, "Comic Sans MS", cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: var(--pen); }
  .postcard:not(.inline) .pc-cap { white-space: nowrap; font-size: 17px; }
  .postcard.inline { position: relative; left: auto !important; top: auto !important; width: auto; min-width: 0; max-width: none; margin: 20px 0 2px; box-shadow: 0 4px 12px rgba(74,64,54,.12); transform: none; }
  .postcard.inline:not(.show) { display: none; }
  .chapter.peek { border-color: var(--coral); box-shadow: 0 0 0 2px rgba(214,104,60,.18); }
  .stop.peek circle { fill: var(--teal); }
  /* Play the story + draw-in */
  .info-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .info-row .info { margin: 0 2px; flex: 1; }
  .play-btn { appearance: none; flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: var(--coral);
              border: 0; border-radius: 999px; min-height: 36px; padding: 7px 15px 7px 12px; cursor: pointer; box-shadow: 0 2px 0 #A9502C; transition: background .15s, transform .1s; }
  .play-btn:hover { background: #C55A30; }
  .play-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #A9502C; }
  .play-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .play-btn .ico { display: inline-block; width: 0; height: 0; border-style: solid; border-width: 5.5px 0 5.5px 9px; border-color: transparent transparent transparent #fff; }
  .play-btn.is-playing .ico { width: 9px; height: 9px; border: 0; background: #fff; border-radius: 1px; }
  .stop { transition: opacity .35s; }
  .stop.off { opacity: 0; pointer-events: none; }
  .notes { transition: opacity .3s; }
  .paper.playing .notes { opacity: 0; }
  @media (max-width: 520px) { .info-row { flex-direction: column; align-items: flex-start; gap: 8px; } }
  @media (prefers-reduced-motion: no-preference) {
    .postcard.show .steam { animation: fof-steam 2.4s ease-in-out infinite; }
    .postcard.show .rain { animation: fof-rain .9s linear infinite; }
    .postcard.show .roll { animation: fof-roll 3.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .postcard.show .bob { animation: fof-bob 1.4s ease-in-out infinite; }
    .postcard.show .bob.up { animation-name: fof-bob-up; }
    .postcard.show .hop { animation: fof-hop 1.1s ease-in-out infinite; }
    .postcard.show .hop.d2 { animation-delay: .2s; } .postcard.show .hop.d3 { animation-delay: .4s; } .postcard.show .hop.d4 { animation-delay: .6s; }
    @keyframes fof-steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes fof-rain { 0% { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }
    @keyframes fof-roll { 0% { transform: translateX(-34px) rotate(0); } 100% { transform: translateX(40px) rotate(360deg); } }
    @keyframes fof-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    @keyframes fof-bob-up { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes fof-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  }
  @media (max-width: 700px) {
    .chapters { grid-template-columns: 1fr; gap: 8px; }
    .chapter button { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: start; }
    .pic { margin: 0; max-width: 96px; }
    .chapter h4 { font-size: 16px; margin-top: 4px; }
    .chapter p { font-size: 13px; }
  }
  @media (max-width: 600px) { .notes { display: none; } .year { font-size: 18px; } .grid-label { font-size: 16px; } }
  @media (max-width: 480px) { .fof-graphic { padding: 20px 16px; } .paper { padding: 10px 8px; } }
</style>
</head>

    var p = pts[STOPS[n]], r = 13 * stopK + 3, d;
    if (p[0] > R + 12) { var my = (T + B) / 2; d = 'M' + R.toFixed(1) + ' ' + my.toFixed(1) + ' Q' + p[0].toFixed(1) + ' ' + my.toFixed(1) + ' ' + p[0].toFixed(1) + ' ' + (p[1] - r).toFixed(1); }
    else { var sx = Math.max(L + 12, Math.min(R - 12, p[0])); d = 'M' + sx.toFixed(1) + ' ' + B.toFixed(1) + ' L' + p[0].toFixed(1) + ' ' + (p[1] - r).toFixed(1); }
    link.setAttribute('d', d); link.setAttribute('visibility', 'visible');
  }
  function show(n) {
    shown = n;
    scenes.forEach(function (sc, k) { sc.classList.toggle('on', k === n); });
    document.getElementById('fof-pc-num').textContent = n + 1;
    document.getElementById('fof-pc-text').textContent = HAND[n];
    if (isMobile() && playing) {
      if (postcard.parentNode !== paper || postcard.nextElementSibling !== svg) paper.insertBefore(postcard, svg);
      postcard.classList.add('inline'); link.setAttribute('visibility', 'hidden'); paper.classList.remove('story-on');
    } else if (isMobile()) {
      if (postcard.parentNode !== cards[n]) cards[n].appendChild(postcard);
      postcard.classList.add('inline'); link.setAttribute('visibility', 'hidden'); paper.classList.remove('story-on');
    } else {
      if (postcard.parentNode !== paper || postcard.nextElementSibling !== infoRow) paper.insertBefore(postcard, infoRow);
      postcard.classList.remove('inline');
      var sr = svg.getBoundingClientRect(), qr = paper.getBoundingClientRect();
      postcard.style.left = (sr.left - qr.left + sr.width * 0.075) + 'px';
      postcard.style.top = (sr.top - qr.top + 6) + 'px';
      paper.classList.add('story-on');
    }
    postcard.classList.add('show');
    if (!isMobile()) requestAnimationFrame(function () { if (shown === n) drawLink(n); });
    mark(n); postHeight();
  }
  function hide() {
    shown = null; postcard.classList.remove('show'); link.setAttribute('visibility', 'hidden');
    paper.classList.remove('story-on'); mark(-1); postHeight();
  }
  function preview(n) { if (isMobile() || playing) return; clearTimeout(leaveTimer); if (shown !== n) show(n); }
  function unpreview() {
    if (playing) return;
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(function () { if (pinned !== null) show(pinned); else hide(); }, 150);
  }
  function choose(n, scroll) {
    if (playing) stopPlay(false);
    clearTimeout(leaveTimer);
    if (isMobile() && pinned === n) { pinned = null; stopEls.forEach(function (s) { s.classList.remove('active'); }); cards.forEach(function (c) { c.classList.remove('active'); }); hide(); return; }
    pinned = n;
    stopEls.forEach(function (s, k) { s.classList.toggle('active', k === n); });
    cards.forEach(function (c, k) { c.classList.toggle('active', k === n); });
    showCursor(STOPS[n]); show(n);
    if (scroll && isMobile()) cards[n].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  cards.forEach(function (c, n) {
    var b = c.querySelector('button');
    b.addEventListener('click', function () { choose(n, false); });
    c.addEventListener('mouseenter', function () { if (!isMobile()) { showCursor(STOPS[n]); preview(n); } });
    c.addEventListener('mouseleave', unpreview);
    b.addEventListener('focus', function () { if (!isMobile()) { showCursor(STOPS[n]); preview(n); } });
    b.addEventListener('blur', unpreview);
  });
  stopEls.forEach(function (g, n) {
    g.addEventListener('pointerenter', function () { showCursor(STOPS[n]); preview(n); });
    g.addEventListener('focus', function () { showCursor(STOPS[n]); preview(n); });
    g.addEventListener('blur', unpreview);
  });

  // Hover or tap along the line to read any quarter
  function showCursor(i) {
    dot.setAttribute('cx', pts[i][0]); dot.setAttribute('cy', pts[i][1]); dot.setAttribute('visibility', 'visible');
    vline.setAttribute('x1', pts[i][0]); vline.setAttribute('x2', pts[i][0]); vline.setAttribute('visibility', 'visible');
    info.innerHTML = describe(i);
  }
  function fromEvent(e) {
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    var i = Math.round((p.x - X0) / (X1 - X0) * (DATA.length - 1));
    return Math.max(0, Math.min(DATA.length - 1, i));
  }
  sizeStops();
  window.addEventListener('resize', function () { sizeStops(); if (shown !== null) show(shown); });
  var hit = document.getElementById('fof-hit');
  hit.addEventListener('pointermove', function (e) { if (playing) return; var i = fromEvent(e); showCursor(i); preview(chapterOf(i)); });
  hit.addEventListener('pointerdown', function (e) { if (playing) return; var i = fromEvent(e); showCursor(i); preview(chapterOf(i)); });
  svg.addEventListener('pointerleave', unpreview);
  svg.insertBefore(hit, stopsG); // keep stops clickable above the hit area

  // ---------- Line draws itself in, and "Play the story" ----------
  var revealRect = document.getElementById('fof-reveal-rect'), revealX = 760, raf = null, playTimer = null;
  var playBtn = document.getElementById('fof-play'), playLbl = playBtn.querySelector('.lbl');
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setReveal(xv) {
    revealX = xv; revealRect.setAttribute('width', Math.max(0, xv));
    stopEls.forEach(function (g, n) { g.classList.toggle('off', pts[STOPS[n]][0] > xv + 1); });
  }
  function animateReveal(to, ms, follow, done) {
    cancelAnimationFrame(raf);
    var from = revealX, t0 = null, last = -1;
    if (calm || ms <= 0) { setReveal(to); if (done) done(); return; }
    function frame(t) {
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      var xv = from + (to - from) * e; setReveal(xv);
      if (follow) { var i = Math.max(0, Math.min(DATA.length - 1, Math.floor((xv - X0) / (X1 - X0) * (DATA.length - 1) + 0.001))); if (i !== last) { last = i; showCursor(i); } }
      if (k < 1) raf = requestAnimationFrame(frame); else if (done) done();
    }
    raf = requestAnimationFrame(frame);
  }
  function setPlayBtn(state) {
    playBtn.classList.toggle('is-playing', state === 'playing');
    playLbl.textContent = state === 'playing' ? 'Stop' : state === 'again' ? 'Play again' : 'Play the story';
  }
  function step(n) {
    var target = pts[STOPS[n]][0] + (n === 4 ? 40 : 1);
    animateReveal(target, n === 0 ? 500 : 1300, true, function () {
      if (!playing) return;
      showCursor(STOPS[n]); show(n);
      playTimer = setTimeout(function () { if (!playing) return; if (n < 4) step(n + 1); else finishPlay(); }, n === 4 ? 3600 : 3200);
    });
  }
  function startPlay() {
    clearTimeout(leaveTimer); clearTimeout(playTimer); cancelAnimationFrame(raf);
    playing = true; pinned = null; setPlayBtn('playing');
    stopEls.forEach(function (s) { s.classList.remove('active'); }); cards.forEach(function (c) { c.classList.remove('active'); });
    hide(); paper.classList.add('playing');
    if (isMobile()) paper.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    setReveal(X0 - 20); step(0);
  }
  function finishPlay() {
    playing = false; paper.classList.remove('playing'); setReveal(760); setPlayBtn('again');
    if (!isMobile()) { pinned = 4; stopEls[4].classList.add('active'); cards[4].classList.add('active'); show(4); }
  }
  function stopPlay(hideCard) {
    playing = false; clearTimeout(playTimer); cancelAnimationFrame(raf);
    paper.classList.remove('playing'); setReveal(760); setPlayBtn('again');
    if (hideCard) hide();
  }
  playBtn.addEventListener('click', function () { if (playing) stopPlay(true); else startPlay(); });

  // Draw the line in the first time the chart scrolls into view
  if (!calm && 'IntersectionObserver' in window) {
    setReveal(X0 - 20);
    var io = new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) return;
      io.disconnect();
      if (!playing) setTimeout(function () { if (!playing) animateReveal(760, 2200, false); }, 150);
    }, { threshold: 0.35 });
    io.observe(svg);
  }

  // ---------- Embed ----------
  var fig = document.querySelector('.fof-graphic');
  var sourceUrl = fig.getAttribute('data-source-url');
  var status = document.getElementById('fof-status');
  function say(msg) { status.textContent = msg; setTimeout(function () { if (status.textContent === msg) status.textContent = ''; }, 4000); }
  var pageUrl = location.href.split('#')[0].split('?')[0];
  var embedCode =
    '<iframe src="' + pageUrl + '" title="How offices changed after the pandemic – FreeOfficeFinder" ' +
    'width="100%" height="1000" style="border:0;width:100%;max-width:760px;" loading="lazy" scrolling="no" data-fof-chart></iframe>\n' +
    '<script>window.addEventListener("message",function(e){if(e.data&&e.data.fofChartHeight){document.querySelectorAll("iframe[data-fof-chart]").forEach(function(f){if(f.contentWindow===e.source)f.style.height=e.data.fofChartHeight+"px";});}});<\/script>\n' +
    '<p style="font:12px Arial,sans-serif;color:#6B6B6B;">Source: <a href="' + sourceUrl + '">FreeOfficeFinder</a></p>';
  var embedBox = document.getElementById('fof-embed-box'), embedBtn = document.getElementById('fof-embed-btn'), codeArea = document.getElementById('fof-embed-code');
  codeArea.value = embedCode;
  embedBtn.addEventListener('click', function () {
    var open = embedBox.classList.toggle('open');
    embedBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { codeArea.focus(); codeArea.select(); }
    postHeight();
  });
  document.getElementById('fof-copy-btn').addEventListener('click', function () {
    codeArea.select();
    var done = function () { say('Embed code copied'); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(codeArea.value).then(done, function () { document.execCommand('copy'); done(); });
    } else { document.execCommand('copy'); done(); }
  });
  function postHeight() {
    if (window.parent === window) return;
    window.parent.postMessage({ fofChartHeight: document.documentElement.scrollHeight }, '*');
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  postHeight();

  // ---------- Download a PNG (without the buttons) ----------
  var dlBtn = document.getElementById('fof-download-btn');
  dlBtn.addEventListener('click', function () {
    if (typeof html2canvas !== 'function') { say('Image tool did not load. Please try again.'); return; }
    if (playing) stopPlay(true);
    dlBtn.disabled = true; say('Preparing image…'); hide();
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
      return html2canvas(fig, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        ignoreElements: function (e) { return e.hasAttribute && e.hasAttribute('data-no-capture'); }
      });
    }).then(function (canvas) {
      canvas.toBlob(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'freeofficefinder-offices-since-the-pandemic.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        dlBtn.disabled = false; say('Image downloaded'); if (pinned !== null) show(pinned);
      }, 'image/png');
    }).catch(function () { dlBtn.disabled = false; say('Sorry, the image could not be created.'); });
  });
});
</script>
</body>
</html>
