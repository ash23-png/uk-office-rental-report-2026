<title>Where office rental values are rising across Britain</title>

<style>

          --fast: #A23C1E; --rising: #DE7446; --steady: #5B929B; --falling: #1D5560; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: var(--body); font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .fof-graphic { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  .kicker { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
  .fof-graphic h3 { margin: 0 0 8px; font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: clamp(24px, 4vw, 32px); line-height: 1.15; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  .dek { margin: 0 0 14px; font-size: 16px; line-height: 1.5; color: var(--body); max-width: 640px; }
  .search-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .search { display: block; width: 100%; font: inherit; font-size: 16px; color: var(--ink); border: 1px solid #BDBDBD; border-radius: 4px; padding: 10px 12px; background: #fff; }
  .search:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }
  .search-row .search { flex: 1 1 220px; }
  .region-select { flex: 1 1 200px; appearance: auto; }
  .paper { position: relative; padding: 0 0 12px; background: #FBF8F2; border: 1px solid #E8E1D3; border-radius: 10px; overflow: hidden; }
  .map-wrap { background: linear-gradient(180deg, #F2F5F4 0%, #EDF2F1 100%); }
  .paper > .key, .paper > .key-areas, .paper > .info { padding-left: 12px; padding-right: 12px; }
  .map { display: block; width: 100%; height: auto; margin: 0 auto; overflow: hidden; }
  .map-wrap { position: relative; }
  .back { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: none; align-items: center; justify-content: center; appearance: none; width: 44px; height: 44px; padding: 0; color: var(--ink); background: #fff; border: 1px solid #D6CDBB; border-radius: 50%; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .back svg { width: 22px; height: 22px; }
  .back:hover { color: #fff; background: var(--teal); border-color: var(--teal); }
  .back:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .paper.zoomed .back { display: inline-flex; }
  .paper.zoomed .callouts { display: none; }
  .la { stroke: #FFFFFF; stroke-width: .45; vector-effect: non-scaling-stroke; transition: opacity .25s; stroke-linejoin: round; cursor: pointer; }
  .la:hover, .la:focus { outline: none; stroke: #4A4036; stroke-width: 1.4; }
  .la.active { stroke: #121212; stroke-width: 2; }
  .grey path { fill: #E9E4DA; stroke: #F6F2EA; stroke-width: .6; vector-effect: non-scaling-stroke; }
  .grey rect.inset { fill: none; stroke: #C9C0AE; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .grey, #fof-las { filter: drop-shadow(0 1.5px 2.5px rgba(40, 60, 60, .22)); }
  .dot { cursor: pointer; }
  .dot circle { stroke: #fff; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.25)); }
  .dot text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 600; fill: #1A1A1A; stroke: rgba(255,255,255,.9); paint-order: stroke; letter-spacing: .01em; stroke-linejoin: round; pointer-events: none; }
  .dot:hover circle, .dot:focus circle, .dot.active circle { stroke: #121212; }
  .dot:focus { outline: none; }
  .pin { font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 700; fill: #121212; stroke: #FFFFFF; paint-order: stroke; stroke-linejoin: round; pointer-events: none; }
  .note { font-family: Caveat, "Comic Sans MS", cursive; font-size: 21px; font-weight: 600; fill: #5A4E40; }
  .note-arrow { fill: none; stroke: #8C7F6E; stroke-width: 1; stroke-dasharray: 2 4; stroke-linecap: round; opacity: .75; }
  /* Key */
  .key { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 12px 0 0; font-size: 13px; color: var(--ink); }
  .kbtn { appearance: none; font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 4px 9px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  @media (hover: hover) { .kbtn:hover { border-color: #D6CDBB; background: #fff; } }
  .kbtn[aria-pressed="true"] { border-color: var(--teal); background: #fff; box-shadow: 0 0 0 1px var(--teal); }
  .kbtn:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .key-areas .kbtn { padding: 2px 7px; gap: 0; }
  .key-note { text-align: center; margin: 6px 12px 0; font-size: 12px; color: var(--muted); }
  .key-hint { text-align: center; margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .key i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #D6CDBB; }
  .key small { color: var(--muted); font-size: 12px; }
  .key-areas { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 12px; margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .key-areas b { display: inline-block; width: 16px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  .info { margin: 10px 4px 0; min-height: 4.2em; font-size: 14px; line-height: 1.4; color: var(--ink); }
  .info strong { font-weight: 600; }
  .info .why { display: block; margin-top: 4px; }
  .info .why b { font-weight: 600; color: var(--teal); }
  .notes-list { display: none; margin: 12px 0 0; padding: 0; list-style: none; font-family: Caveat, "Comic Sans MS", cursive; font-size: 20px; line-height: 1.3; color: #4A4036; }
  .notes-list li { margin: 0 0 4px; }
  .notes-list strong { font-weight: 600; }
  /* Cities by region */
  .cities { margin: 12px 0 0; }
  .cflow { margin: 0; font-size: 12px; line-height: 1.9; color: var(--body); }
  .clabel { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); margin-right: 8px; white-space: nowrap; }
  .chip { appearance: none; font: inherit; color: var(--body); background: none; border: 0; padding: 0; margin: 0 7px 0 0; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
  @media (hover: hover) { .chip:hover { color: var(--teal); text-decoration: underline; text-underline-offset: 2px; } }
  .chip.on { color: var(--teal); font-weight: 600; }
  .chip:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .footer { margin-top: 14px; font-size: 12px; line-height: 1.55; color: var(--muted); }
  .footer p { margin: 0 0 6px; }
  .footer strong { color: var(--body); font-weight: 600; }
  .footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .credit { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--teal); }
  .credit a { color: inherit; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .tool-btn { appearance: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--teal); background: #fff; border: 1px solid var(--teal); border-radius: 4px; min-height: 40px; padding: 8px 14px; cursor: pointer; }
  .tool-btn:hover { background: var(--teal); color: #fff; }
  .tool-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .tool-btn[disabled] { opacity: .6; cursor: wait; }
  .embed-box { display: none; margin-top: 10px; }
  .embed-box.open { display: block; }
  .embed-box label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .embed-box textarea { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 10px; resize: vertical; }
  .embed-row { margin-top: 8px; }
  .status { font-size: 12px; color: var(--teal); }
  @media (max-width: 600px) { .callouts { display: none; } .notes-list { display: block; } }
  @media (max-width: 480px) { .fof-graphic { padding: 20px 16px; } .paper { padding: 0 0 10px; } }

  </div>
</figure>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var CAT = { fast: ['Rising fast', '#A23C1E'], rising: ['Rising', '#DE7446'], steady: ['Steady', '#5B929B'], falling: ['Falling', '#1D5560'] };
  // Council areas use the same three bands as the city labels, in soft tints
  function tint(p) { return p >= 20 ? '#EDAE8A' : p >= 10 ? '#F7D7C2' : p >= 0 ? '#BFD8DB' : '#8DB0B7'; }
  function band(p) { return p >= 20 ? 'rising fast' : p >= 10 ? 'rising' : p >= 0 ? 'steady' : 'falling'; }
  function chg(p) { p = parseFloat(p); return (p < 0 ? 'down ' + Math.abs(p).toFixed(1) : 'up ' + p.toFixed(1)) + '%'; }
  function bench(el) { return el.dataset.r === 'Scotland' ? 'Scotland: 4.5%, measured 2022 to 2025' : 'England and Wales: 14.5%'; }
  var info = document.getElementById('fof-info');
  var DEFAULT_INFO = info.innerHTML;
  var paper = document.getElementById('fof-paper');
  var mapEl = document.getElementById('fof-map');
  var group = document.getElementById('fof-las');
  var pin = document.getElementById('fof-pin');
  var NS = 'http://www.w3.org/2000/svg';
  var las = Array.prototype.slice.call(document.querySelectorAll('.la'));
  var greys = Array.prototype.slice.call(document.querySelectorAll('.grey path'));
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));
  var byCode = {}, byName = {}, dotByName = {};
  las.forEach(function (el) {
    byCode[el.dataset.c] = el; byName[el.dataset.n.toLowerCase()] = el;
    el.setAttribute('fill', tint(parseFloat(el.dataset.p)));
    el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button');
    el.setAttribute('aria-label', el.dataset.n + ': official office rental values ' + chg(el.dataset.p));
    el.addEventListener('click', function () { pick(el); });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(el); } });
  });
  dots.forEach(function (d) { d.querySelector('circle').setAttribute('fill', CAT[d.dataset.cat][1]); dotByName[d.dataset.place.toLowerCase()] = d; });

  // ---------- Zooming ----------
  function isNarrow() { return window.matchMedia('(max-width: 600px)').matches; }
  function fullVB() { return isNarrow() ? [-48, 0, 612, 945] : [-30, 0, 790, 945]; }
  var vb = fullVB(), raf = null, currentRegion = '';
  function setVB(v) { vb = v; mapEl.setAttribute('viewBox', v.map(function (n) { return n.toFixed(1); }).join(' ')); sizeDots(); }
  function animateVB(to) {
    cancelAnimationFrame(raf);
    var from = vb.slice(), t0 = null, ms = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 450;
    if (!ms) { setVB(to); return; }
    function step(t) { if (t0 === null) t0 = t; var k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      setVB(from.map(function (f, i) { return f + (to[i] - f) * e; })); if (k < 1) raf = requestAnimationFrame(step); }
    raf = requestAnimationFrame(step);
    setTimeout(function () { if (vb[2] !== to[2]) setVB(to); }, ms + 600);
  }
  function boxVB(x0, y0, x1, y1) {
    var w = x1 - x0, h = y1 - y0, pad = Math.max(w, h) * 0.08, full = fullVB(), ratio = full[2] / full[3];
    w += pad * 2; h += pad * 2; x0 -= pad; y0 -= pad;
    if (w / h > ratio) { var nh = w / ratio; y0 -= (nh - h) / 2; h = nh; } else { var nw = h * ratio; x0 -= (nw - w) / 2; w = nw; }
    return [x0, y0, w, h];
  }
  function regionVB(name) {
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    function add(b) { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height); }
    las.forEach(function (el) { if (el.dataset.r === name) add(el.getBBox()); });
    return boxVB(x0, y0, x1, y1);
  }
  function sizeDots() {
    var w = mapEl.getBoundingClientRect().width || 600, k = vb[2] / w;
    var fs = (isNarrow() ? 11 : 12) * k;
    dots.forEach(function (d) {
      var c = d.querySelector('circle'); c.setAttribute('r', (7 * k).toFixed(2)); c.setAttribute('stroke-width', (2 * k).toFixed(2));
      var t = d.querySelector('text'); if (!t) return;
      t.style.display = (isNarrow() && !currentRegion && d.dataset.crowd && !d.classList.contains('hl')) ? 'none' : '';
      var cx = +c.getAttribute('cx'), cy = +c.getAttribute('cy'), pos = d.dataset.pos || 'r', gap = 10 * k;
      t.setAttribute('font-size', fs.toFixed(2)); t.setAttribute('stroke-width', (3 * k).toFixed(2));
      if (pos === 'r') { t.setAttribute('x', cx + gap); t.setAttribute('y', cy + fs * 0.35); t.setAttribute('text-anchor', 'start'); }
      if (pos === 'l') { t.setAttribute('x', cx - gap); t.setAttribute('y', cy + fs * 0.35); t.setAttribute('text-anchor', 'end'); }
      if (pos === 't') { t.setAttribute('x', cx); t.setAttribute('y', cy - gap); t.setAttribute('text-anchor', 'middle'); }
      if (pos === 'b') { t.setAttribute('x', cx); t.setAttribute('y', cy + gap + fs * 0.75); t.setAttribute('text-anchor', 'middle'); }
    });
  }

  // ---------- Regions ----------
  var sel = document.getElementById('fof-region');
  function citiesIn(name) { return dots.filter(function (d) { return d.dataset.r === name; }); }
  function regionText(name) {
    var c = citiesIn(name);
    if (name === 'Scotland') return '<strong>Scotland:</strong> office values up 4.5% overall in Scotland\'s 2026 revaluation (2022 to 2025, measured separately from England and Wales). Rising in Edinburgh, steady in Glasgow, falling in Aberdeen.';
    var list = c.length ? ' Our cities here: ' + c.map(function (d) { return d.dataset.place + ' (' + CAT[d.dataset.cat][0].toLowerCase() + ')'; }).join(', ') + '.' : ' None of our 19 cities is in this region.';
    return '<strong>' + name + '.</strong>' + list + '';
  }
  function clearKey() { kbtns.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); dots.forEach(function (d) { d.classList.remove('hl'); }); sizeDots(); }
  function selectRegion(name, quiet) {
    clearKey();
    currentRegion = name; sel.value = name; clearPin();
    las.forEach(function (el) { el.classList.remove('active'); el.style.opacity = (!name || el.dataset.r === name) ? 1 : 0.25; });
    dots.forEach(function (d) { d.style.opacity = (!name || d.dataset.r === name) ? 1 : 0.25; d.classList.remove('active'); });
    paper.classList.toggle('zoomed', !!name);
    chips.forEach(function (c) { c.classList.remove('on'); });
    animateVB(name ? regionVB(name) : fullVB());
    if (!quiet) info.innerHTML = name ? regionText(name) : DEFAULT_INFO;
  }
  sel.addEventListener('change', function () { selectRegion(sel.value); });
  function showAll() { search.value = ''; selectRegion(''); }
  document.getElementById('fof-back').addEventListener('click', showAll);
  // Tapping the sea (or grey areas) also zooms back out
  mapEl.addEventListener('click', function (e) { if (currentRegion && !e.target.closest('.la, .dot')) showAll(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && currentRegion) showAll(); });

  // ---------- Picking an area or a city ----------
  function clearPin() { while (pin.firstChild) pin.removeChild(pin.firstChild); }
  function addPin(el, label) {
    setTimeout(function () {
      clearPin();
      var target = regionVB(el.dataset.r), fs = target[2] / 34, b = el.getBBox();
      var x = b.x + b.width / 2, y = b.y - fs * 0.5;
      var txt = document.createElementNS(NS, 'text');
      txt.setAttribute('x', x); txt.setAttribute('y', y); txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('class', 'pin');
      txt.setAttribute('font-size', fs.toFixed(1)); txt.setAttribute('stroke-width', (fs / 4).toFixed(1));
      txt.textContent = label;
      pin.appendChild(txt);
      var w = txt.getBBox().width, minX = target[0] + fs * 0.3, maxX = target[0] + target[2] - fs * 0.3;
      if (x - w / 2 < minX) txt.setAttribute('x', minX + w / 2); else if (x + w / 2 > maxX) txt.setAttribute('x', maxX - w / 2);
      if (y - fs < target[1]) txt.setAttribute('y', b.y + b.height + fs * 1.1);
    }, 30);
  }
  function pick(el, quietPin, fromSearch) {
    // Tap the selected area again to deselect it
    if (!fromSearch && el.classList.contains('active')) { selectRegion(currentRegion); return; }
    if (currentRegion !== el.dataset.r) selectRegion(el.dataset.r, true);
    las.forEach(function (b) { b.classList.remove('active'); if (b.dataset.r === el.dataset.r) b.style.opacity = b === el ? 1 : 0.45; });
    dots.forEach(function (d) { d.classList.remove('active'); });
    chips.forEach(function (c) { c.classList.remove('on'); });
    el.classList.add('active'); group.appendChild(el);
    var p = parseFloat(el.dataset.p);
    info.innerHTML = '<strong>' + el.dataset.n + ':</strong> ' + chg(el.dataset.p) + ' (' + bench(el) + ').';
    if (!quietPin) addPin(el, el.dataset.n + ': ' + chg(el.dataset.p));
  }
  function why(d) { return d.dataset.story ? '<span class="why"><b>What\'s happening:</b> ' + d.dataset.story + '</span>' : ''; }
  function pickCity(d) {
    if (d.classList.contains('active')) { selectRegion(currentRegion); return; }
    var name = d.dataset.place, cat = CAT[d.dataset.cat][0].toLowerCase();
    if (d.dataset.london) {
      selectRegion('London', true);
      info.innerHTML = '<strong>London:</strong> rising, fastest in outer London<span class="why"><b>What\'s happening:</b> office occupancy was just 42% in early 2026, against 69% in Bristol.</span>';
    } else {
      var el = byCode[d.dataset.c]; pick(el, true);
      info.innerHTML = '<strong>' + name + ':</strong> ' + cat + why(d);
    }
    d.classList.add('active');
    chips.forEach(function (c) { c.classList.toggle('on', c.dataset.place === name); });
  }
  dots.forEach(function (d) {
    d.addEventListener('click', function (e) { e.stopPropagation(); pickCity(d); });
    d.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickCity(d); } });
  });

  // ---------- Search ----------
  var dl = document.getElementById('fof-areas');
  las.map(function (el) { return el.dataset.n; }).concat(['Aberdeen', 'Edinburgh', 'Glasgow']).sort().forEach(function (n) { var o = document.createElement('option'); o.value = n; dl.appendChild(o); });
  var search = document.getElementById('fof-search');
  search.addEventListener('input', function () {
    var v = search.value.trim().toLowerCase(); if (!v) return;
    if (dotByName[v] && (dotByName[v].dataset.r === 'Scotland' || dotByName[v].dataset.london)) { pickCity(dotByName[v]); return; }
    var el = byName[v];
    if (!el) { var keys = Object.keys(byName).filter(function (k) { return k.indexOf(v) === 0; }); if (keys.length === 1) el = byName[keys[0]]; }
    if (el) pick(el, false, true);
  });

  // ---------- Cities grouped by the study's labels ----------
  var box = document.getElementById('fof-cities'), h = '';
  h = '<p class="cflow"><span class="clabel">Our cities</span>';
  ['fast', 'rising', 'steady', 'falling'].forEach(function (cat) {
    dots.filter(function (d) { return d.dataset.cat === cat; }).map(function (d) { return d.dataset.place; }).sort().forEach(function (n) {
      h += '<button type="button" class="chip" data-place="' + n + '" title="' + CAT[cat][0] + '"><i style="background:' + CAT[cat][1] + '"></i>' + n + '</button>';
    });
  });
  h += '</p>';
  box.innerHTML = h;
  var chips = Array.prototype.slice.call(box.querySelectorAll('.chip'));
  chips.forEach(function (c) { c.addEventListener('click', function () { pickCity(dotByName[c.dataset.place.toLowerCase()]); mapEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }); });

  // ---------- Key: tap a group to pick it out ----------
  var kbtns = Array.prototype.slice.call(document.querySelectorAll('.kbtn'));
  function joinNames(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  var BAND_TEST = { fast: function (p) { return p >= 20; }, rising: function (p) { return p >= 10 && p < 20; }, steady: function (p) { return p >= 0 && p < 10; }, falling: function (p) { return p < 0; } };
  var BAND_TEXT = { fast: 'rose 20% or more', rising: 'rose 10% to under 20%', steady: 'rose less than 10%', falling: 'fell' };
  kbtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-pressed') === 'true';
      if (currentRegion) { search.value = ''; selectRegion('', true); }
      clearPin(); clearKey();
      chips.forEach(function (c) { c.classList.remove('on'); });
      las.forEach(function (el) { el.classList.remove('active'); });
      dots.forEach(function (d) { d.classList.remove('active'); });
      if (on) { las.forEach(function (el) { el.style.opacity = 1; }); dots.forEach(function (d) { d.style.opacity = 1; }); info.innerHTML = DEFAULT_INFO; return; }
      b.setAttribute('aria-pressed', 'true');
      if (b.dataset.cat) {
        var cat = b.dataset.cat, names = [];
        las.forEach(function (el) { el.style.opacity = 0.35; });
        dots.forEach(function (d) { var hit = d.dataset.cat === cat; d.style.opacity = hit ? 1 : 0.15; d.classList.toggle('hl', hit); if (hit) names.push(d.dataset.place); });
        sizeDots();
        info.innerHTML = '<strong>' + CAT[cat][0] + ':</strong> ' + joinNames(names) + (names.length === 1 ? ', the only one of our 19 cities.' : ' (' + names.length + ' of our 19 cities).') + '';
      } else {
        var test = BAND_TEST[b.dataset.band], ew = 0, sc = 0, ewAll = 0, scAll = 0;
        las.forEach(function (el) { var hit = test(parseFloat(el.dataset.p)), isS = el.dataset.r === 'Scotland'; el.style.opacity = hit ? 1 : 0.12; if (isS) { scAll++; if (hit) sc++; } else { ewAll++; if (hit) ew++; } });
        dots.forEach(function (d) { d.style.opacity = 0.3; });
        info.innerHTML = 'Office values ' + BAND_TEXT[b.dataset.band] + ' in <strong>' + ew + ' of ' + ewAll + ' council areas in England and Wales</strong> and <strong>' + sc + ' of ' + scAll + ' in Scotland</strong> (measured separately).';
      }
    });
  });

  window.addEventListener('resize', function () { setVB(currentRegion ? regionVB(currentRegion) : fullVB()); });
  setVB(fullVB());
  // Open zoomed on a region if the link ends in its name, e.g. #scotland or #north-west
  (function () {
    var want = decodeURIComponent((location.hash || '').slice(1)).toLowerCase().replace(/[^a-z]/g, '');
    if (!want) return;
    Array.prototype.forEach.call(sel.options, function (o) { if (o.value && o.value.toLowerCase().replace(/[^a-z]/g, '') === want) setTimeout(function () { selectRegion(o.value); }, 50); });
  })();

  // ---------- Embed ----------
  var fig = document.querySelector('.fof-graphic');
  var sourceUrl = fig.getAttribute('data-source-url');
  var status = document.getElementById('fof-status');
  function say(msg) { status.textContent = msg; setTimeout(function () { if (status.textContent === msg) status.textContent = ''; }, 4000); }
  var pageUrl = location.href.split('#')[0].split('?')[0];
  var embedCode =
    '<iframe src="' + pageUrl + '" title="Where office rental values are rising across Britain – FreeOfficeFinder" ' +
    'width="100%" height="1400" style="border:0;width:100%;max-width:760px;" loading="lazy" scrolling="no" data-fof-chart></iframe>\n' +
    '<script>window.addEventListener("message",function(e){if(e.data&&e.data.fofChartHeight){document.querySelectorAll("iframe[data-fof-chart]").forEach(function(f){if(f.contentWindow===e.source)f.style.height=e.data.fofChartHeight+"px";});}});<\/script>\n' +
    '<p style="font:12px Arial,sans-serif;color:#6B6B6B;">Source: <a href="' + sourceUrl + '">FreeOfficeFinder</a></p>';
  var embedBox = document.getElementById('fof-embed-box'), embedBtn = document.getElementById('fof-embed-btn'), codeArea = document.getElementById('fof-embed-code');
  codeArea.value = embedCode;
  embedBtn.addEventListener('click', function () {
    var open = embedBox.classList.toggle('open');
    embedBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { codeArea.focus(); codeArea.select(); }
    postHeight();
  });
  document.getElementById('fof-copy-btn').addEventListener('click', function () {
    codeArea.select();
    var done = function () { say('Embed code copied'); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(codeArea.value).then(done, function () { document.execCommand('copy'); done(); });
    } else { document.execCommand('copy'); done(); }
  });
  // Tell the page the chart's real height (measured from the chart itself, so it can shrink as well as grow)
  // Downloads: the picture tool can't see web fonts inside the map drawing, so we hand them over directly
  function fofFontCSS() {
    var url = 'https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@500;600;700&display=swap';
    return fetch(url).then(function (r) { return r.text(); }).then(function (css) {
      var blocks = css.split('/* ').filter(function (b) { return b.indexOf('latin */') === 0; }).map(function (b) { return b.slice(b.indexOf('@font-face')); });
      return Promise.all(blocks.map(function (b) {
        var m = b.match(/url\((https:[^)]+)\)/); if (!m) return b;
        return fetch(m[1]).then(function (r) { return r.blob(); }).then(function (blob) {
          return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { res(b.replace(m[1], fr.result)); }; fr.readAsDataURL(blob); });
        });
      })).then(function (parts) { return parts.join('\n'); });
    }).catch(function () { return ''; });
  }
  function fofEmbedFonts(doc, css) {
    if (!css) return;
    Array.prototype.forEach.call(doc.querySelectorAll('svg'), function (svg) {
      var st = doc.createElementNS('http://www.w3.org/2000/svg', 'style'); st.textContent = css; svg.insertBefore(st, svg.firstChild);
    });
  }
  function postHeight() {
    if (window.parent === window) return;
    var g = document.querySelector('.fof-graphic');
    var h = g ? Math.ceil(g.getBoundingClientRect().height) : document.body.scrollHeight;
    window.parent.postMessage({ fofChartHeight: h }, '*');
  }
  if (window.ResizeObserver && document.querySelector('.fof-graphic')) new ResizeObserver(postHeight).observe(document.querySelector('.fof-graphic'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  postHeight();

  // ---------- Download a PNG (without the buttons) ----------
  var dlBtn = document.getElementById('fof-download-btn');
  function makeCanvas() {
    return (document.fonts ? document.fonts.ready : Promise.resolve()).then(fofFontCSS).then(function (fontCSS) {
      return html2canvas(fig, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        onclone: function (doc) { fofEmbedFonts(doc, fontCSS); },
        ignoreElements: function (e) { return e.hasAttribute && e.hasAttribute('data-no-capture'); }
      });
    }).then(function (c) { fig.classList.remove('fof-capturing'); return c; }, function (e) { fig.classList.remove('fof-capturing'); throw e; });
  }
  // Downloads always show the full, desktop-size chart, whatever the reader's screen size:
  // we draw it in a hidden full-width copy of this page and save that picture.
  function captureFull() {
    return new Promise(function (resolve, reject) {
      var f = document.createElement('iframe'), done = false;
      f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
      f.style.cssText = 'position:absolute;left:-12000px;top:0;width:800px;height:2400px;border:0;';
      function finish(ok, val) { if (done) return; done = true; window.removeEventListener('message', onMsg); if (f.parentNode) f.parentNode.removeChild(f); if (ok) resolve(val); else reject(); }
      function onMsg(e) { if (e.source === f.contentWindow && e.data && e.data.fofCapture) finish(e.data.fofCapture !== 'error', e.data.fofCapture); }
      window.addEventListener('message', onMsg);
      f.src = location.pathname + '?fofcapture=1' + '';
      document.body.appendChild(f);
      setTimeout(function () { finish(false); }, 25000);
    });
  }
  dlBtn.addEventListener('click', function () {
    if (typeof html2canvas !== 'function') { say('Image tool did not load. Please try again.'); return; }
    dlBtn.disabled = true; say('Preparing image…');
    var fileName = 'freeofficefinder-office-rental-values-map.png';
    captureFull().catch(function () { return makeCanvas().then(function (cv) { return cv.toDataURL('image/png'); }); })
      .then(function (url) { return fetch(url).then(function (r) { return r.blob(); }); })
      .then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        dlBtn.disabled = false; say('Map downloaded');
      })
      .catch(function () { dlBtn.disabled = false; say('Sorry, the image could not be created.'); });
  });
  // When this page is the hidden full-width copy, draw the picture and hand it back
  if (/[?&]fofcapture=1/.test(location.search) && window.parent !== window) {
    window.addEventListener('load', function () {
      setTimeout(function () {
        makeCanvas().then(function (cv) { window.parent.postMessage({ fofCapture: cv.toDataURL('image/png') }, '*'); }, function () { window.parent.postMessage({ fofCapture: 'error' }, '*'); });
      }, 400);
    });
  }
});
</script>
