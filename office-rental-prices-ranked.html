<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office rental prices ranked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #23606C;
    --ink: #121212;
    --body: #333333;
    --muted: #6B6B6B;
    --rule: #E1E1E1;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: var(--body); font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .fof-graphic { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  .kicker { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
  .fof-graphic h3 { margin: 0 0 20px; font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: clamp(24px, 4vw, 32px); line-height: 1.15; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-top: 3px solid var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  thead th { padding: 0; text-align: left; font-weight: 500; border-bottom: 1px solid var(--ink); vertical-align: bottom; }
  thead th button { all: unset; box-sizing: border-box; display: block; width: 100%; min-height: 44px; padding: 10px 8px; cursor: pointer; font-size: 11px; line-height: 1.3; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  thead th button:hover { color: var(--ink); }
  thead th button:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
  .fof-capturing thead th button::after { content: none !important; }
  thead th button::after { content: "↕"; margin-left: 4px; opacity: .4; }
  thead th[aria-sort="ascending"] button, thead th[aria-sort="descending"] button { color: var(--ink); }
  thead th[aria-sort="ascending"] button::after { content: "↑"; opacity: 1; }
  thead th[aria-sort="descending"] button::after { content: "↓"; opacity: 1; }
  tbody td { padding: 11px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .rank { width: 44px; font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .city { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .price { width: 60%; }
  .bar-wrap { display: flex; align-items: center; gap: 10px; }
  .bar { height: 14px; border-radius: 0 2px 2px 0; flex: none; }
  .city small { display: block; margin-top: 1px; font-size: 11px; font-weight: 400; color: var(--muted); }
  tr.ref td { background: #FBF6EC; }
  .price-val { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .footer { margin-top: 14px; font-size: 12px; line-height: 1.55; color: var(--muted); }
  .footer p { margin: 0 0 6px; }
  .footer strong { color: var(--body); font-weight: 600; }
  .footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .credit { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--teal); }
  .credit a { color: inherit; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .tool-btn { appearance: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--teal); background: #fff; border: 1px solid var(--teal); border-radius: 4px; min-height: 40px; padding: 8px 14px; cursor: pointer; }
  .tool-btn:hover { background: var(--teal); color: #fff; }
  .tool-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .tool-btn[disabled] { opacity: .6; cursor: wait; }
  .embed-box { display: none; margin-top: 10px; }
  .embed-box.open { display: block; }
  .embed-box label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .embed-box textarea { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 10px; resize: vertical; }
  .embed-row { margin-top: 8px; }
  .status { font-size: 12px; color: var(--teal); }
  @media (max-width: 480px) {
    .fof-graphic { padding: 20px 16px; }
    table { font-size: 14px; } .rank { width: 30px; font-size: 15px; }
    tbody td { padding: 10px 6px; } thead th button { padding: 10px 6px; }
    .price { width: auto; } .bar-wrap { gap: 6px; } .bar { height: 12px; }
  }
  @media (max-width: 400px) { .city { white-space: normal; } .rank { width: 26px; } }
  @media (max-width: 340px) { table { font-size: 13px; } .footer { font-size: 11px; } }
</style>
</head>
<body>
<figure class="fof-graphic" data-source-url="https://www.freeofficefinder.com/hub/research-reports/uk-office-rental-report-2026">
  <p class="kicker">Office rental prices</p>
  <h3>The most expensive places in Britain to rent an office</h3>
  <div class="scroll">
    <table id="fof-cities">
      <thead>
        <tr>
          <th data-key="rank" aria-sort="ascending"><button type="button">Rank</button></th>
          <th data-key="city"><button type="button">Town or city</button></th>
          <th data-key="price"><button type="button">Desk in a private office, a month</button></th>
        </tr>
      </thead>
      <tbody>
        <tr class="ref" data-price="634"><td class="rank">–</td><td class="city">Central London<small>For comparison, not ranked</small></td><td class="price"></td></tr>
        <tr data-rank="1" data-city="Cambridge" data-price="588"><td class="rank">1</td><td class="city">Cambridge</td><td class="price"></td></tr>
        <tr data-rank="2" data-city="London (whole city)" data-price="483"><td class="rank">2</td><td class="city">London (whole city)</td><td class="price"></td></tr>
        <tr data-rank="3" data-city="Bristol" data-price="372"><td class="rank">3</td><td class="city">Bristol</td><td class="price"></td></tr>
        <tr data-rank="4" data-city="Oxford" data-price="362"><td class="rank">4</td><td class="city">Oxford</td><td class="price"></td></tr>
        <tr data-rank="5" data-city="Birmingham" data-price="347"><td class="rank">5</td><td class="city">Birmingham</td><td class="price"></td></tr>
        <tr data-rank="6" data-city="Brighton" data-price="344"><td class="rank">6</td><td class="city">Brighton</td><td class="price"></td></tr>
        <tr data-rank="7" data-city="Leeds" data-price="343"><td class="rank">7</td><td class="city">Leeds</td><td class="price"></td></tr>
        <tr data-rank="8" data-city="Reading" data-price="336"><td class="rank">8</td><td class="city">Reading</td><td class="price"></td></tr>
        <tr data-rank="9" data-city="St Albans" data-price="328"><td class="rank">9</td><td class="city">St Albans</td><td class="price"></td></tr>
        <tr data-rank="10" data-city="Manchester" data-price="326"><td class="rank">10</td><td class="city">Manchester</td><td class="price"></td></tr>
        <tr data-rank="11" data-city="Milton Keynes" data-price="308"><td class="rank">11</td><td class="city">Milton Keynes</td><td class="price"></td></tr>
        <tr data-rank="12" data-city="Edinburgh" data-price="268"><td class="rank">12</td><td class="city">Edinburgh</td><td class="price"></td></tr>
        <tr data-rank="13" data-city="Aberdeen" data-price="267"><td class="rank">13</td><td class="city">Aberdeen</td><td class="price"></td></tr>
        <tr data-rank="14" data-city="Liverpool" data-price="262"><td class="rank">14</td><td class="city">Liverpool</td><td class="price"></td></tr>
        <tr data-rank="15" data-city="Glasgow" data-price="251"><td class="rank">15</td><td class="city">Glasgow</td><td class="price"></td></tr>
        <tr data-rank="16" data-city="Slough" data-price="218"><td class="rank">16</td><td class="city">Slough</td><td class="price"></td></tr>
        <tr data-rank="17" data-city="Newcastle" data-price="209"><td class="rank">17</td><td class="city">Newcastle</td><td class="price"></td></tr>
        <tr data-rank="18" data-city="Cardiff" data-price="199"><td class="rank">18</td><td class="city">Cardiff</td><td class="price"></td></tr>
        <tr data-rank="19" data-city="Basingstoke" data-price="190"><td class="rank">19</td><td class="city">Basingstoke</td><td class="price"></td></tr>
      </tbody>
    </table>
  </div>
  <div class="footer">
    <p>Monthly price of one desk in a private office, Q3 2026 (prices dated 16 July 2026). The 19 towns and cities are ranked; central London is shown for comparison only, as it is part of London rather than a town or city on its own. London (whole city) is the average for London as a whole.<span data-no-capture> Tap a heading to sort.</span> <strong>Source:</strong> <a href="https://www.freeofficefinder.com/hub/research-reports/uk-office-rental-report-2026" target="_blank" rel="noopener">FreeOfficeFinder</a> pricing tool.</p>
  </div>
  <div class="credit"><a href="https://www.freeofficefinder.com/hub/research-reports/uk-office-rental-report-2026" target="_blank" rel="noopener">FreeOfficeFinder</a></div>
  <div class="tools" data-no-capture>
    <button type="button" class="tool-btn" id="fof-embed-btn" aria-expanded="false" aria-controls="fof-embed-box">Embed this chart</button>
    <button type="button" class="tool-btn" id="fof-download-btn">Download image</button>
    <span class="status" id="fof-status" role="status" aria-live="polite"></span>
  </div>
  <div class="embed-box" id="fof-embed-box" data-no-capture>
    <label for="fof-embed-code">Copy this code and paste it into your page:</label>
    <textarea id="fof-embed-code" readonly></textarea>
    <div class="embed-row"><button type="button" class="tool-btn" id="fof-copy-btn">Copy code</button></div>
  </div>
</figure>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var fig = document.querySelector('.fof-graphic');
  var sourceUrl = fig.getAttribute('data-source-url');
  var table = document.getElementById('fof-cities');
  var tbody = table.tBodies[0];
  var rows = Array.prototype.slice.call(tbody.rows).filter(function (r) { return !r.classList.contains('ref'); });
  var ref = tbody.querySelector('tr.ref');
  var dark = [35, 96, 108], pale = [196, 216, 219], maxRank = 19, maxPrice = 640;
  function pos(price) { return 'calc((100% - 64px) * ' + (price / maxPrice).toFixed(3) + ')'; }

  // Price bars, shaded by rank: darkest at the top, lightest at the bottom.
  rows.forEach(function (row) {
    var d = row.dataset;
    var t = (parseInt(d.rank, 10) - 1) / (maxRank - 1);
    var c = dark.map(function (v, i) { return Math.round(v + (pale[i] - v) * t); });
    row.cells[2].innerHTML = '<div class="bar-wrap"><span class="bar" style="width:' + pos(d.price) + ';background:rgb(' + c.join(',') + ')"></span>' +
      '<span class="price-val">£' + Number(d.price).toLocaleString('en-GB') + '</span></div>';
  });

  // Central London comparison row: coral bar, always stays at the top.
  ref.cells[2].innerHTML = '<div class="bar-wrap"><span class="bar" style="width:' + pos(ref.dataset.price) + ';background:#D6683C"></span>' +
    '<span class="price-val">£' + Number(ref.dataset.price).toLocaleString('en-GB') + '</span></div>';

  // Tap or click a heading to sort; again to reverse.
  var headers = table.tHead.rows[0].cells;
  Array.prototype.forEach.call(headers, function (th) {
    th.querySelector('button').addEventListener('click', function () {
      var key = th.dataset.key;
      var cur = th.getAttribute('aria-sort');
      var dir = cur === 'ascending' ? 'descending' : cur === 'descending' ? 'ascending'
              : (key === 'rank' || key === 'city') ? 'ascending' : 'descending';
      Array.prototype.forEach.call(headers, function (h) { h.removeAttribute('aria-sort'); });
      th.setAttribute('aria-sort', dir);
      var sign = dir === 'ascending' ? 1 : -1;
      rows.sort(function (a, b) {
        var va = a.dataset[key], vb = b.dataset[key];
        if (key === 'city') return sign * va.localeCompare(vb);
        var diff = parseFloat(va) - parseFloat(vb);
        return diff !== 0 ? sign * diff : (parseInt(a.dataset.rank, 10) - parseInt(b.dataset.rank, 10));
      });
      rows.forEach(function (row) { tbody.appendChild(row); });
    });
  });

  // ---------- Embed ----------
  var status = document.getElementById('fof-status');
  function say(msg) { status.textContent = msg; setTimeout(function () { if (status.textContent === msg) status.textContent = ''; }, 4000); }

  var pageUrl = location.href.split('#')[0].split('?')[0];
  var embedCode =
    '<iframe src="' + pageUrl + '" title="The most expensive places in Britain to rent an office – FreeOfficeFinder" ' +
    'width="100%" height="1150" style="border:0;width:100%;max-width:760px;" loading="lazy" scrolling="no" data-fof-chart></iframe>\n' +
    '<script>window.addEventListener("message",function(e){if(e.data&&e.data.fofChartHeight){document.querySelectorAll("iframe[data-fof-chart]").forEach(function(f){if(f.contentWindow===e.source)f.style.height=e.data.fofChartHeight+"px";});}});<\/script>\n' +
    '<p style="font:12px Arial,sans-serif;color:#6B6B6B;">Source: <a href="' + sourceUrl + '">FreeOfficeFinder</a></p>';
  var embedBox = document.getElementById('fof-embed-box');
  var embedBtn = document.getElementById('fof-embed-btn');
  var codeArea = document.getElementById('fof-embed-code');
  codeArea.value = embedCode;
  embedBtn.addEventListener('click', function () {
    var open = embedBox.classList.toggle('open');
    embedBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { codeArea.focus(); codeArea.select(); }
    postHeight();
  });
  document.getElementById('fof-copy-btn').addEventListener('click', function () {
    codeArea.select();
    var done = function () { say('Embed code copied'); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(codeArea.value).then(done, function () { document.execCommand('copy'); done(); });
    } else { document.execCommand('copy'); done(); }
  });

  // When embedded, tell the host page how tall the chart is so the iframe fits with no scrollbar.
  // Tell the page the chart's real height (measured from the chart itself, so it can shrink as well as grow)
  function postHeight() {
    if (window.parent === window) return;
    var g = document.querySelector('.fof-graphic');
    var h = g ? Math.ceil(g.getBoundingClientRect().height) : document.body.scrollHeight;
    window.parent.postMessage({ fofChartHeight: h }, '*');
  }
  if (window.ResizeObserver && document.querySelector('.fof-graphic')) new ResizeObserver(postHeight).observe(document.querySelector('.fof-graphic'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  postHeight();

  // ---------- Download a PNG of the chart (without the buttons) ----------
  var dlBtn = document.getElementById('fof-download-btn');
  function makeCanvas() {
    return (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
      fig.classList.add('fof-capturing');
      return html2canvas(fig, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
                ignoreElements: function (el) { return el.hasAttribute && el.hasAttribute('data-no-capture'); }
      });
    }).then(function (c) { fig.classList.remove('fof-capturing'); return c; }, function (e) { fig.classList.remove('fof-capturing'); throw e; });
  }
  // Downloads always show the full, desktop-size chart, whatever the reader's screen size:
  // we draw it in a hidden full-width copy of this page and save that picture.
  function captureFull() {
    return new Promise(function (resolve, reject) {
      var f = document.createElement('iframe'), done = false;
      f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
      f.style.cssText = 'position:absolute;left:-12000px;top:0;width:800px;height:2400px;border:0;';
      function finish(ok, val) { if (done) return; done = true; window.removeEventListener('message', onMsg); if (f.parentNode) f.parentNode.removeChild(f); if (ok) resolve(val); else reject(); }
      function onMsg(e) { if (e.source === f.contentWindow && e.data && e.data.fofCapture) finish(e.data.fofCapture !== 'error', e.data.fofCapture); }
      window.addEventListener('message', onMsg);
      f.src = location.pathname + '?fofcapture=1' + '';
      document.body.appendChild(f);
      setTimeout(function () { finish(false); }, 25000);
    });
  }
  dlBtn.addEventListener('click', function () {
    if (typeof html2canvas !== 'function') { say('Image tool did not load. Please try again.'); return; }
    dlBtn.disabled = true; say('Preparing image…');
    var fileName = 'freeofficefinder-office-rental-prices-ranked.png';
    captureFull().catch(function () { return makeCanvas().then(function (cv) { return cv.toDataURL('image/png'); }); })
      .then(function (url) { return fetch(url).then(function (r) { return r.blob(); }); })
      .then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        dlBtn.disabled = false; say('Image downloaded');
      })
      .catch(function () { dlBtn.disabled = false; say('Sorry, the image could not be created.'); });
  });
  // When this page is the hidden full-width copy, draw the picture and hand it back
  if (/[?&]fofcapture=1/.test(location.search) && window.parent !== window) {
    window.addEventListener('load', function () {
      setTimeout(function () {
        makeCanvas().then(function (cv) { window.parent.postMessage({ fofCapture: cv.toDataURL('image/png') }, '*'); }, function () { window.parent.postMessage({ fofCapture: 'error' }, '*'); });
      }, 400);
    });
  }
});
</script>
</body>
</html>
