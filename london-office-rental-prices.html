<title>London areas ranked by desk price</title>

<style>
  :root {
    --teal: #23606C;
    --ink: #121212;
    --body: #333333;
    --muted: #6B6B6B;
    --rule: #E1E1E1;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: var(--body); font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .fof-graphic { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  .kicker { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
  .fof-graphic h3 { margin: 0 0 16px; font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: clamp(24px, 4vw, 32px); line-height: 1.15; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  .search { display: block; width: 100%; max-width: 320px; margin: 0 0 16px; font: inherit; font-size: 16px; color: var(--ink); border: 1px solid #BDBDBD; border-radius: 4px; padding: 10px 12px; }
  .search:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }
  .scroll { border-top: 3px solid var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  thead th { padding: 0; text-align: left; font-weight: 500; border-bottom: 1px solid var(--ink); vertical-align: bottom; }
  thead th button { all: unset; box-sizing: border-box; display: block; width: 100%; min-height: 44px; padding: 10px 8px; cursor: pointer; font-size: 11px; line-height: 1.3; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  thead th button:hover { color: var(--ink); }
  thead th button:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
  .fof-capturing thead th button::after { content: none !important; }
  thead th button::after { content: "↕"; margin-left: 4px; opacity: .4; }
  thead th[aria-sort="ascending"] button, thead th[aria-sort="descending"] button { color: var(--ink); }
  thead th[aria-sort="ascending"] button::after { content: "↑"; opacity: 1; }
  thead th[aria-sort="descending"] button::after { content: "↓"; opacity: 1; }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  tbody tr.hidden { display: none; }
  .rank { width: 44px; font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .area { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .area small { display: block; margin-top: 1px; font-size: 11px; font-weight: 400; color: var(--muted); }
  .price { width: 55%; }
  .bar-wrap { display: flex; align-items: center; gap: 10px; }
  .bar { height: 14px; border-radius: 0 2px 2px 0; flex: none; }
  .price-val { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .no-results { display: none; padding: 16px 8px; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--rule); }
  .more { display: block; width: 100%; margin-top: 12px; }
  .footer { margin-top: 14px; font-size: 12px; line-height: 1.55; color: var(--muted); }
  .footer p { margin: 0 0 6px; }
  .footer strong { color: var(--body); font-weight: 600; }
  .footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .credit { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--teal); }
  .credit a { color: inherit; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .tool-btn { appearance: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--teal); background: #fff; border: 1px solid var(--teal); border-radius: 4px; min-height: 40px; padding: 8px 14px; cursor: pointer; }
  .tool-btn:hover { background: var(--teal); color: #fff; }
  .tool-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .tool-btn[disabled] { opacity: .6; cursor: wait; }
  .embed-box { display: none; margin-top: 10px; }
  .embed-box.open { display: block; }
  .embed-box label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .embed-box textarea { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 10px; resize: vertical; }
  .embed-row { margin-top: 8px; }
  .status { font-size: 12px; color: var(--teal); }
  /* Tabs */
  .tabs { display: inline-flex; gap: 4px; margin: 0 0 16px; padding: 4px; background: #F1F3F3; border-radius: 999px; }
  .tabs button { appearance: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 0; border-radius: 999px; min-height: 40px; padding: 8px 20px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--teal); color: #fff; }
  .tabs button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  [hidden] { display: none !important; }
  /* Storybook map */
  .paper { position: relative; padding: 14px 12px 12px; background: #FBF6EC; border: 1px solid #EADFC9; border-radius: 10px;
           background-image: radial-gradient(rgba(120,100,70,.06) 1px, transparent 1px); background-size: 6px 6px; }
  .map { display: block; width: 100%; height: auto; overflow: visible; }
  .borough { stroke: #FBF6EC; stroke-width: 1.8; stroke-linejoin: round; cursor: pointer; transition: opacity .15s; }
  .borough:hover, .borough:focus { outline: none; stroke: #4A4036; stroke-width: 2.2; }
  .borough.active { stroke: #4A4036; stroke-width: 2.6; }
  .thames { fill: none; stroke: #9CC3CF; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .9; pointer-events: none; }
  .river-label { font-family: "Source Serif 4", Georgia, serif; font-style: italic; font-size: 13px; fill: #5D8A97; pointer-events: none; }
  .note { font-family: Caveat, "Comic Sans MS", cursive; font-size: 21px; font-weight: 600; fill: #4A4036; }
  .note-arrow { fill: none; stroke: #4A4036; stroke-width: 1.6; stroke-dasharray: 4 4; stroke-linecap: round; }
  .legend { margin-top: 10px; max-width: 420px; font-size: 12px; color: var(--muted); }
  .legend .ramp { display: block; height: 10px; border-radius: 999px; background: linear-gradient(90deg, #23606C 0%, #6FA0A8 15.6%, #EEE8D8 32.2%, #F0AA7D 48.9%, #D6683C 71.1%, #96341E 100%); }
  .legend-labels { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .legend-labels span:nth-child(2) { text-align: center; }
  .legend-labels span:last-child { text-align: right; }
  .info { margin: 10px 0 0; min-height: 2.6em; font-size: 14px; line-height: 1.4; color: var(--ink); }
  .info strong { font-weight: 600; }
  .bflow { margin: 12px 0 0; }
  .bflow p { margin: 0; font-size: 12.5px; line-height: 1.9; color: var(--body); }
  .bflow .clabel { display: inline-block; min-width: 92px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); margin-right: 6px; white-space: nowrap; }
  .bflow .chip { appearance: none; font: inherit; color: var(--body); background: none; border: 0; padding: 0; margin: 0 9px 0 0; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .bflow .chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  @media (hover: hover) { .bflow .chip:hover { color: var(--teal); text-decoration: underline; text-underline-offset: 2px; } }
  .bflow .chip.on { color: var(--teal); font-weight: 600; }
  .notes-list { display: none; margin: 12px 0 0; padding: 0; list-style: none; font-family: Caveat, "Comic Sans MS", cursive; font-size: 20px; line-height: 1.3; color: #4A4036; }
  .notes-list li { margin: 0 0 4px; }
  .notes-list strong { font-weight: 600; }
  @media (max-width: 480px) {
    .fof-graphic { padding: 20px 16px; } .search { max-width: none; }
    table { font-size: 14px; } .rank { width: 30px; font-size: 15px; }
    tbody td { padding: 9px 6px; } thead th button { padding: 10px 6px; }
    .price { width: auto; } .bar-wrap { gap: 6px; } .bar { height: 12px; }
  }
  @media (max-width: 600px) { .callouts { display: none; } .notes-list { display: block; } .river-label { font-size: 18px; } }
  @media (max-width: 400px) { .area { white-space: normal; } .rank { width: 26px; } }
  @media (max-width: 340px) { table { font-size: 13px; } .footer { font-size: 11px; } }
</style>
</head>

    return new Promise(function (resolve, reject) {
      var f = document.createElement('iframe'), done = false;
      f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
      f.style.cssText = 'position:absolute;left:-12000px;top:0;width:800px;height:2400px;border:0;';
      function finish(ok, val) { if (done) return; done = true; window.removeEventListener('message', onMsg); if (f.parentNode) f.parentNode.removeChild(f); if (ok) resolve(val); else reject(); }
      function onMsg(e) { if (e.source === f.contentWindow && e.data && e.data.fofCapture) finish(e.data.fofCapture !== 'error', e.data.fofCapture); }
      window.addEventListener('message', onMsg);
      f.src = location.pathname + '?fofcapture=1' + (panels[1].hidden ? '' : '#map');
      document.body.appendChild(f);
      setTimeout(function () { finish(false); }, 25000);
    });
  }
  dlBtn.addEventListener('click', function () {
    if (typeof html2canvas !== 'function') { say('Image tool did not load. Please try again.'); return; }
    dlBtn.disabled = true; say('Preparing image…');
    var fileName = panels[1].hidden ? 'freeofficefinder-london-areas-ranked.png' : 'freeofficefinder-london-rising-map.png';
    captureFull().catch(function () { return makeCanvas().then(function (cv) { return cv.toDataURL('image/png'); }); })
      .then(function (url) { return fetch(url).then(function (r) { return r.blob(); }); })
      .then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        dlBtn.disabled = false; say('Image downloaded');
      })
      .catch(function () { dlBtn.disabled = false; say('Sorry, the image could not be created.'); });
  });
  // When this page is the hidden full-width copy, draw the picture and hand it back
  if (/[?&]fofcapture=1/.test(location.search) && window.parent !== window) {
    window.addEventListener('load', function () {
      setTimeout(function () {
        makeCanvas().then(function (cv) { window.parent.postMessage({ fofCapture: cv.toDataURL('image/png') }, '*'); }, function () { window.parent.postMessage({ fofCapture: 'error' }, '*'); });
      }, 400);
    });
  }

  // ---------- Tabs ----------
  var title = document.getElementById('fof-title');
  var tabs = [document.getElementById('fof-tab-rank'), document.getElementById('fof-tab-map')];
  var panels = [document.getElementById('fof-panel-rank'), document.getElementById('fof-panel-map')];
  var mapFooter = document.getElementById('fof-map-footer');
  var titles = ['The most expensive places in London to rent a desk', 'Where London\u2019s office rental values are rising fastest'];
  function selectTab(i) {
    tabs.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; panels[j].hidden = i !== j; });
    mapFooter.hidden = i !== 1;
    title.textContent = titles[i];
    if (embedBox.classList.contains('open')) codeArea.value = makeEmbed();
    embedBtn.textContent = i === 1 ? 'Embed this map' : 'Embed this chart';
    dlBtn.textContent = i === 1 ? 'Download map' : 'Download image';
    postHeight();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { selectTab(i); });
    t.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var n = (i + 1) % 2; tabs[n].focus(); selectTab(n); }
    });
  });

  // ---------- Storybook heat map ----------
  // Two colours: teal = slower than the England and Wales rise (14.5%), coral = faster.
  var stops = [[0, [35, 96, 108]], [7, [111, 160, 168]], [14.5, [238, 232, 216]], [22, [240, 170, 125]], [32, [214, 104, 60]], [45, [150, 52, 30]]];
  function heat(p) {
    p = Math.max(0, Math.min(45, p));
    for (var i = 1; i < stops.length; i++) {
      if (p <= stops[i][0]) {
        var a = stops[i - 1], b = stops[i], t = (p - a[0]) / (b[0] - a[0]);
        return 'rgb(' + a[1].map(function (v, k) { return Math.round(v + (b[1][k] - v) * t); }).join(',') + ')';
      }
    }
  }
  var info = document.getElementById('fof-info');
  var DEFAULT_INFO = info.innerHTML;
  var boroughs = Array.prototype.slice.call(document.querySelectorAll('.borough'));
  boroughs.forEach(function (el) {
    el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button');
    el.setAttribute('aria-label', el.dataset.name + ': official rental values up ' + el.dataset.pct + '%');
    el.setAttribute('fill', heat(parseFloat(el.dataset.pct)));
    function pick() {
      // Tap again to deselect
      if (el.classList.contains('active')) { el.classList.remove('active'); info.innerHTML = DEFAULT_INFO; return; }
      boroughs.forEach(function (b) { b.classList.remove('active'); });
      el.classList.add('active');
      el.parentNode.appendChild(el);
      info.innerHTML = '<strong>' + el.dataset.name + ':</strong> official office rental values up ' + el.dataset.pct + '% (2021 to 2024), across ' + Number(el.dataset.n).toLocaleString('en-GB') + ' offices.';
    }
    el.addEventListener('click', function () { pick(); syncChips(); });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });

  // Fastest and slowest five boroughs, tap a name to pick it out on the map
  var bflow = document.getElementById('fof-bflow');
  var sorted = boroughs.slice().sort(function (a, b) { return parseFloat(b.dataset.pct) - parseFloat(a.dataset.pct); });
  function chipsFor(list) { return list.map(function (el) { return '<button type="button" class="chip" data-name="' + el.dataset.name + '"><i style="background:' + el.getAttribute('fill') + '"></i>' + el.dataset.name + '</button>'; }).join(''); }
  bflow.innerHTML = '<p><span class="clabel">Fastest rise</span>' + chipsFor(sorted.slice(0, 5)) + '</p><p><span class="clabel">Slowest rise</span>' + chipsFor(sorted.slice(-5).reverse()) + '</p>';
  var bchips = Array.prototype.slice.call(bflow.querySelectorAll('.chip'));
  function syncChips() { var a = document.querySelector('.borough.active'); bchips.forEach(function (c) { c.classList.toggle('on', !!a && a.dataset.name === c.dataset.name); }); }
  bchips.forEach(function (c) { c.addEventListener('click', function () { var el = boroughs.filter(function (b) { return b.dataset.name === c.dataset.name; })[0]; if (el) el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }); });

  refresh();
  // Open on the map if the link ends in #map (used by the map's embed code).
  if (/^#map$/i.test(location.hash) || /[?&]view=map/i.test(location.search)) selectTab(1);
});
</script>
</body>
</html>
